spring:
  application:
    name: kanban-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/kanban}
    username: ${DATABASE_USERNAME:kanban}
    password: ${DATABASE_PASSWORD:kanban}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha

server:
  port: ${SERVER_PORT:8080}
